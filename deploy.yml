- name: Deploy application
  hosts: "{{ env }}"
  tasks:
    - name: Ensure /opt/app exists
      file:
        path: /opt/app
        state: directory
        mode: '0755'

    - name: Copy artifact to server
      copy:
        src: app.jar
        dest: /opt/app/app.jar
        mode: '0644'
      notify: Restart application service

  handlers:
    - name: Restart application service
      service:
        name: myapp
        state: restarted
        enabled: true